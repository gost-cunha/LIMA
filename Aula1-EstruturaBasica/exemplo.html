<!DOCTYPE html> <!-- Informar tipo de documento - HTML5 -->
<html lang="pt-BR"> <!-- Colocando que linguagem padrão do website é pt-BR -->

<head> <!-- Cabeça do site -->
    <meta charset="UTF-8"> <!-- Formatar letras para UTF-8 -->
    <meta name="description" content="Exemplo HTML"> <!-- Uma breve descrição do website -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Controlar largura e escala website -->
    <title>Minha Primeira Página HTML</title> <!-- Título do website -->
</head>

<body> <!-- Corpo do site -->
    <!-- Tipos de h -->
    <h1>Olá, Mundo!</h1>
    <h2>Olá, Mundo!</h2>
    <h3>Olá, Mundo!</h3>
    <h4>Olá, Mundo!</h4>
    <h5>Olá, Mundo!</h5>
    <h6>Olá, Mundo!</h6>

    <p>Meu primeiro parágrafo em HTML</p> <!-- Criando um parágrafo -->

    <img src="imagem-senai.jpg" alt="Imagem portaria SENAI" width="200px"> <!-- Uma imagem com largura de 200px -->

    <br> <!-- Pular linha -->

    <a href="https://www.google.com.br" target="_blank">Clique aqui</a> <!-- Link de redirecionamento para outra página -->

    <!-- Lista por números: 1., 2., 3. ... -->
    <ol>
        <li></li>
        <li></li>
        <li></li>
    </ol>

    <!-- Lista por bolinhas -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    
    <b>Bold</b> <!-- Bordar uma letra -->
    <br>
    <i>Italic</i> <!-- Deixa letra em formatato "italic", meio caída -->
    <br>
    <u>Underline</u> <!-- Adicionar linhagem abaixo da letra -->

    <hr> <!-- Linha -->
    <br>
</body>

</html>
