<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Aula 2</title>
</head>

<body>
    <div style="border: 1px solid black; padding: 10px;">
        <h2 style="text-align: center;">Notícia do dia</h2>
        <p style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">Hoje tivemos um evento importante...</p>
        <p>Este é um <span style="color: red; font-size: 100px;">aviso importante</span> no meio do texto.</p>
    </div>
    <hr>
    <header>
        <b>HEADER</b> - <i>CABEÇALHO</i>
    </header>
    <main>
        <strong>MAIN</strong> - <em>PARTE PRINCIPAL</em>
    </main>
    <footer>
        FOOTER - RODAPÉ
    </footer>
    <p>E = mc<sup>2</sup></p>
    <p>H<sub>2</sub>O</p>
    <hr>
    <p style="text-align: left;">Texto alinhado à esquerda.</p>
    <p style="text-align: center;">Texto centralizado.</p>
    <p style="text-align: right;">Texto alinhado à direita.</p>
    <p style="text-align: justify;">Texto justificado, preenchendo a largura da linha.</p>
</body>

</html>
