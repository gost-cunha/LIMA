<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato de Cores</title>
</head>

<body>
    <header>
        <h1>Cores, Imagens e Links</h1>
    </header>

    <main>
        <section>
            <h2>Formatos de Cor no CSS:</h2>
            <ul>
                <li style="color: #FF5733;">
                    Frase com cor em Hexadecimal
                </li>
                <li style="color: rgb(0, 128, 255);">
                    Frase com cor em RGB
                </li>
                <li style="color: rgba(0, 128, 0, 0.6);
                ">
                    Frase com cor em RGBA
                </li>
            </ul>
        </section>

        <hr>

        <section>
            <p style="color: blue;">Texto em cor específica</p>
            <p style="background-color: rgb(0, 255, 13);">Fundo do texto em uma cor específica!</p>

            <img src="assets/fundo.jpg" alt="Teste" title="Teste">
        </section>

        <hr>

        <section>
            <div style="border: 1px solid red; width: 500px; height: 500px; color: yellow; text-align: center; background-image: url(assets/fundo.jpg); background-position: center; background-repeat: no-repeat; background-image: 200px 200px;">
                <h2>Imagem como background</h2>
                <p>Esta seção tem uma imagem de fundo.</p>
            </div>
        </section>

        <hr>

        <section>
            <h1>Vídeos em HTML</h1>
            <video src="assets/video.mp4" controls autoplay loop muted width="560" height="315">
                Seu navegador não suporta o elemento de vídeo.
            </video>
        </section>

        <hr>

        <section>
            <h1>Vídeos Externos</h1>
            <iframe src="https://www.youtube.com/embed/Wu3Y_v8JeE8?si=sYnBwCqNfA_VdK9C"></iframe>
            <iframe src="https://www.google.com/maps/embed?pb=!4v1790002896179!6m8!1m7!1sjFAW18jPUZPjvsbYknSdkA!2m2!1d-21.48403767780956!2d-47.00790854170459!3f156.79942959299933!4f-19.57347018545441!5f0.7820865974627469"></iframe>
        </section>
    </main>
</body>

</html>
