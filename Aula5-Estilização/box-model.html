<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        div {
            margin: 20px;
        }

        .content-box {
            background-color: cyan;
            width: 300px;
            padding: 25px;
            border: 5px solid red;
            box-sizing: content-box;
            /* Tamanho total: soma width ou heigth + padding + border */
        }

        .border-box {
            background-color: gray;
            width: 300px;
            padding: 25px;
            border: 5px solid red;
            box-sizing: border-box;
            /* Tamanho total: soma width e heigth */
        }
    </style>
</head>

<body>
    <h1>Exemplos box-level e inline-level</h1>
    <p>Parágrafo é box-level (quebra de linha automaticamente), mas os <a href="#">links são inline-level</a>
        (permanecem na mesma linha).</p>

    <h2>box-sizing:</h2>
    <div class="content-box">Content-box (padrão)</div>
    <div class="border-box">Border-box</div>
</body>

</html>
